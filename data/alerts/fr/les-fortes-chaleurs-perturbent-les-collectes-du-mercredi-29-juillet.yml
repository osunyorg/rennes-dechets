title: >-
  Les fortes chaleurs perturberont les collectes du mercredi 29 juillet
level: warning
content: >-
  <p>Les collectes de l'après-midi seront décalées et pourront se dérouler jusqu'à 2h du matin.<br>Les  plateformes végétaux ainsi que les déchèteries d'Acigné,  Cesson-Sévigné, Chantepie, Gévezé, La Chapelle-des-Fougeretz, Rennes  Baud, Rennes Boëdriers, Romillé, Thorigné-Fouillard et Vezin-le-Coquet  seront fermées toute la journée.<br>Les tri-troc mobiles seront ouvertes de 9h30 à 13h30.<br>Les  déchèteries de Betton, Bruz, Mordelles, Pacé, Rennes La Harpe,  Saint-Armel, Saint-Erblon et Saint-Jacques-de-la-Lande seront ouvertes  aux horaires habituels.  </p>
