content: >-
  <p>Vous habitez en maison ?   Les calendriers de collecte pour la période octobre 2026, septembre 2027 sont accessibles sur notre site internet. Ils sont diffusés dans les 43 communes de la métropole, par voie postale, tout au long du mois de septembre. Surveillez votre boite aux lettres !  </p>
